name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Unit tests
        run: CGO_ENABLED=0 go test -count=1 ./internal/...
      - name: Cross-builds (cgo-free)
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/pelfs

  e2e:
    # The whole user-facing workflow -- create, write, seal, read back,
    # encrypt, prefetch, lease, gc, fsck -- in a container, because the
    # gate mounts a real filesystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Full workflow loop in a container against fakeorigin
        run: ./scripts/e2e-docker.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Resolve the module we ACTUALLY build against: with a replace in
      # effect, .Version is the replaced-away pin, so cloning upstream at
      # it would build a server without the very fixes the replace
      # exists to supply. This follows the replacement and falls back to
      # upstream automatically once the replace is dropped.
      - name: Determine pelican source (honors any go.mod replace)
        id: pelican
        run: |
          mod=$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{else}}{{.Path}}{{end}}' github.com/pelicanplatform/pelican)
          ver=$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/pelicanplatform/pelican)
          sha=$(echo "$ver" | grep -oE '[0-9a-f]{12}$')
          if [ -z "$sha" ]; then echo "could not derive a commit from $mod $ver" >&2; exit 1; fi
          echo "repo=https://$mod" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building pelican from $mod at $sha"
      - name: Fetch pelican source at that commit
        run: |
          git clone --filter=blob:none ${{ steps.pelican.outputs.repo }} pelican-src
          git -C pelican-src checkout ${{ steps.pelican.outputs.sha }}
      - name: Build pelican web assets
        working-directory: pelican-src
        run: make web-build
      - name: Build pelican binary
        working-directory: pelican-src
        run: go build -tags forceposix,server -o "$GITHUB_WORKSPACE/pelican-bin" ./cmd
      - name: Integration tests against federation-in-a-box
        run: PELICAN_BIN="$GITHUB_WORKSPACE/pelican-bin" ./scripts/integration-pelican.sh

  fuzz:
    # Tier 1 (parsers): unrestricted — pure functions over untrusted
    # federation bytes, safe to run anywhere. Short smoke runs; the
    # corpus in testdata/ carries forward every past finding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Fuzz parsers (30s each)
        run: |
          set -e
          for t in \
            "internal/packstore FuzzDecodeTrailer" \
            "internal/packstore FuzzParseTail" \
            "internal/superblock FuzzDecodeVerify" \
            "internal/entrycodec FuzzDecode" \
            "internal/chunkid FuzzChunker" \
            "internal/catalog FuzzStaticCatalog"; do
            set -- $t
            echo "== $2 =="
            CGO_ENABLED=0 go test -run xxx -fuzz "^$2\$" -fuzztime 30s "./$1/"
          done

  opfuzz:
    # Tier 2 (filesystem operation sequences): CONTAINED, always. The
    # launcher cross-compiles on the host and runs the binary in a
    # sealed, network-less, read-only container — never on the runner
    # filesystem directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Op-sequence fuzzing (contained)
        run: ./scripts/opfuzz-docker.sh 120s FuzzOps
      - name: Concurrent op stress under -race (contained)
        run: ./scripts/opfuzz-docker.sh 0 ConcurrentOpsStress

  mount-gate:
    # A REAL kernel mount of a published generation through
    # genfs+rawfuse, exercised by the end-to-end mount script. Linux only
    # — this is the coverage a macFUSE-less dev machine cannot provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: Mount a published generation and benchmark it
        env:
          PELFS_MOUNT_TEST_OK: "1"
        run: ./scripts/mount-gate-test.sh

  bench:
    # Benchmarks are not a pass/fail gate; they run to catch build rot in
    # the harness and to leave numbers in the log for comparison.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Microbenchmarks
        run: CGO_ENABLED=0 go test -run xxx -bench . -benchtime 0.3s ./internal/genfs/
