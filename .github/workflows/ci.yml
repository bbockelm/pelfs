name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      # ./... rather than ./internal/...: cmd/pelfs holds the tests for the
      # mount session itself -- the exit seal, the checkpoint cadence, what a
      # FAILED seal leaves behind. Every one of them stands up its own
      # httptest fakeorigin and needs nothing but loopback, so the paths
      # closest to a user were being left out of CI for no reason at all.
      - name: Unit tests
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Cross-builds (cgo-free)
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/pelfs

  e2e:
    # The whole user-facing workflow -- create, write, seal, read back,
    # encrypt, prefetch, lease, gc, fsck -- in a container, because the
    # gate mounts a real filesystem.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Full workflow loop in a container against fakeorigin
        run: ./scripts/e2e-docker.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Resolve the module we ACTUALLY build against: with a replace in
      # effect, .Version is the replaced-away pin, so cloning upstream at
      # it would build a server without the very fixes the replace
      # exists to supply. This follows the replacement and falls back to
      # upstream automatically once the replace is dropped.
      - name: Determine pelican source (honors any go.mod replace)
        id: pelican
        run: |
          mod=$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{else}}{{.Path}}{{end}}' github.com/pelicanplatform/pelican)
          ver=$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/pelicanplatform/pelican)
          sha=$(echo "$ver" | grep -oE '[0-9a-f]{12}$')
          if [ -z "$sha" ]; then echo "could not derive a commit from $mod $ver" >&2; exit 1; fi
          echo "repo=https://$mod" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building pelican from $mod at $sha"
      - name: Fetch pelican source at that commit
        run: |
          git clone --filter=blob:none ${{ steps.pelican.outputs.repo }} pelican-src
          git -C pelican-src checkout ${{ steps.pelican.outputs.sha }}
      - name: Build pelican web assets
        working-directory: pelican-src
        run: make web-build
      - name: Build pelican binary
        working-directory: pelican-src
        run: go build -tags forceposix,server -o "$GITHUB_WORKSPACE/pelican-bin" ./cmd
      - name: Integration tests against federation-in-a-box
        run: PELICAN_BIN="$GITHUB_WORKSPACE/pelican-bin" ./scripts/integration-pelican.sh

  fuzz:
    # Tier 1 (parsers): unrestricted — pure functions over untrusted
    # federation bytes, safe to run anywhere. Short smoke runs on top of
    # the checked-in corpus under each package's testdata/fuzz/, which
    # every ordinary `go test` replays as well — that is what carries a
    # finding forward once it has been found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      # The corpus is the point of the job: fail loudly if it went missing
      # rather than fuzzing from nothing and calling it a pass.
      - name: Check the committed corpus is there
        run: |
          set -e
          for d in internal/packstore/testdata/fuzz/FuzzDecodeTrailer \
                   internal/packstore/testdata/fuzz/FuzzParseTail \
                   internal/superblock/testdata/fuzz/FuzzDecodeVerify \
                   internal/entrycodec/testdata/fuzz/FuzzDecode \
                   internal/chunkid/testdata/fuzz/FuzzChunker \
                   internal/catalog/testdata/fuzz/FuzzStaticCatalog; do
            n=$(find "$d" -type f 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "no corpus in $d" >&2; exit 1; }
            echo "$d: $n inputs"
          done
      - name: Fuzz parsers (30s each)
        run: |
          set -e
          for t in \
            "internal/packstore FuzzDecodeTrailer" \
            "internal/packstore FuzzParseTail" \
            "internal/superblock FuzzDecodeVerify" \
            "internal/entrycodec FuzzDecode" \
            "internal/chunkid FuzzChunker" \
            "internal/catalog FuzzStaticCatalog"; do
            set -- $t
            echo "== $2 =="
            CGO_ENABLED=0 go test -run xxx -fuzz "^$2\$" -fuzztime 30s "./$1/"
          done
      # A failing input is written into the package's own testdata/fuzz
      # directory, which is exactly the file that has to be committed to
      # carry the finding forward. Upload it, or the one artifact that
      # made this job worth running dies with the runner.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: internal/*/testdata/fuzz/**
          if-no-files-found: warn

  opfuzz:
    # Tier 2 (filesystem operation sequences): CONTAINED, always. The
    # launcher cross-compiles on the host and runs the binary in a
    # sealed, network-less, read-only container — never on the runner
    # filesystem directly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Op-sequence fuzzing (contained)
        run: ./scripts/opfuzz-docker.sh 120s FuzzOps
      - name: Concurrent op stress under -race (contained)
        run: ./scripts/opfuzz-docker.sh 0 ConcurrentOpsStress

  mount-gate:
    # A REAL kernel mount of a published generation through
    # genfs+rawfuse, exercised by the end-to-end mount script. Linux only
    # — this is the coverage a macFUSE-less dev machine cannot provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      # Through the container launcher, not the script bare: the gate's NFS
      # leg needs a kernel NFS client, and the runner image has no
      # nfs-common. mount-gate-docker.sh builds an image that does, which
      # is why the leg now hard-fails when mount.nfs is missing instead of
      # printing a note and passing.
      - name: Mount a published generation and benchmark it
        run: ./scripts/mount-gate-docker.sh

  big-tree:
    # The scale gate: 50,000 files (62,500 with the hard links) untarred
    # through BOTH frontends, diffed live, sealed, cold-remounted into a
    # state dir that has never existed, fsck'd, gc'd, and then done again
    # as a second generation carrying adds, a modify and a delete.
    #
    # Until this existed, the largest tree CI put through a real mount was
    # a handful of files, and the only big-tree numbers anyone had came
    # from running a benchmark by hand and reading it.
    #
    # Measured 3.9 minutes end to end (Docker on an M-series Mac). The
    # in-script cap is set below the job cap on purpose: it fails with a
    # sentence about which phase stalled, where the job cap just kills the
    # runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: 50k files, both frontends, two generations
        env:
          PELFS_GATE_TIMEOUT: "1200"
          # Measured 1.46x at this size; the extra room is for a noisy
          # shared runner, not for a slower write path.
          PELFS_MAX_DECAY: "2.5"
          PELFS_BENCH_OUT: ${{ github.workspace }}/bigtree-out
        run: ./scripts/bench-untar-nfs-docker.sh 50000 2500 4
      - name: Upload the gate's logs and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: big-tree-logs
          path: bigtree-out/
          if-no-files-found: warn

  bench:
    # Benchmarks are not a pass/fail gate; they run to catch build rot in
    # the harness and to leave numbers in the log for comparison.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Microbenchmarks
        run: CGO_ENABLED=0 go test -run xxx -bench . -benchtime 0.3s ./internal/genfs/
