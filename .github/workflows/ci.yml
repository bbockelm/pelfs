name: CI

on:
  push:
    branches: [main]
    # Tags too. CI did not run on them at all, so the one commit whose
    # results anyone will ever look up — the one a release was cut from —
    # was the one commit nothing checked. The release job at the bottom is
    # gated on this trigger and runs only after the gates pass.
    tags: ["v*"]
  pull_request:

# Every job carries a timeout-minutes, sized at roughly 2x its measured
# runtime (measurements are in each job's comment; they were taken on
# Docker for Mac, and the runners are slower, hence 2x rather than 1.5x).
# The default is SIX HOURS: a stalled job holds a runner for a working day
# and reports nothing, and a stall is the failure mode this whole
# punchlist is hunting. A job that trips its timeout is a bug report.
permissions:
  contents: read

jobs:
  unit:
    # go vet + go test ./... + four cross-builds. 34s of tests locally.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      # gofmt is not a matter of taste here: two files reached main
      # unformatted and two separate agents reported them as noise rather
      # than fixing them, because nothing failed. `gofmt -l` names the
      # files and exits 0 either way, so the emptiness is the assertion.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            echo "run: gofmt -w $unformatted" >&2
            exit 1
          fi
      # ./... rather than ./internal/...: cmd/pelfs holds the tests for the
      # mount session itself -- the exit seal, the checkpoint cadence, what a
      # FAILED seal leaves behind. Every one of them stands up its own
      # httptest fakeorigin and needs nothing but loopback, so the paths
      # closest to a user were being left out of CI for no reason at all.
      # -timeout well under the job's timeout-minutes, and deliberately
      # so. A hung package is the failure mode that actually happened
      # (internal/lease, run 32363030647): a job cap kills the runner and
      # leaves a red X with no evidence, whereas Go's own deadline panics
      # with a goroutine dump naming the test and the exact select it is
      # parked on. That dump is what made the lease bug a ten-minute
      # diagnosis instead of a hunt. Always let Go's timeout fire first.
      - name: Unit tests
        run: CGO_ENABLED=0 go test -count=1 -timeout 8m ./...
      # windows/amd64 is in here as well as in the `windows` job below, and
      # deliberately: this step runs in seconds on a runner that is already
      # warm, so a Windows build break is reported by the FIRST job to
      # finish rather than by the slowest one. The windows job is what
      # vets and runs tests; this is the tripwire.
      - name: Cross-builds (cgo-free)
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/pelfs
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/pelfs

  windows:
    # THE WINDOWS GATE. It exists because a WebDAV frontend for Windows is
    # the next thing to be built, and a port that is not compiled every day
    # is a port that rots between one commit and the next.
    #
    # What it proves: the whole tree builds and vets for windows/amd64, and
    # the packages whose behaviour is platform-independent actually PASS
    # there rather than merely compiling.
    #
    # WHAT IS DELIBERATELY NOT RUN, and why, because a skip list nobody
    # explained is a skip list nobody revisits:
    #
    #   - internal/rawfuse has no Windows files at all (`//go:build
    #     !windows`): go-fuse is the Unix kernel protocol in Go types and
    #     cannot be ported. cmd/pelfs therefore has no FUSE backend here,
    #     which is what cmd/pelfs/fusefront_windows.go says out loud.
    #   - cmd/pelfs, internal/genfs, internal/overlay, internal/publish,
    #     internal/merge, internal/repack, internal/fsck, internal/reach,
    #     internal/rescue, internal/vfsbilly, internal/nfsmount,
    #     internal/testvol: every one of them either mounts, shells out to
    #     a Unix binary, or turns on unlinking a file that is still open —
    #     which POSIX allows and Windows refuses. Those are real, listed
    #     defects (docs/TODO.md, winport-agent), not flakes, and they get
    #     fixed before their packages join this list.
    #   - internal/fsperm and internal/idmap: os.Getuid() is -1 on Windows,
    #     so the credential these packages are about does not exist. A
    #     green run here would mean nothing.
    #   - internal/control: the control socket is AF_UNIX in the state
    #     directory. Windows has AF_UNIX, but not unlink-on-close, so a
    #     stale socket file makes the next bind fail.
    #   - internal/rotate: the retired-key archive is mode 0400, which Go
    #     maps to FILE_ATTRIBUTE_READONLY, and Windows refuses to
    #     delete or rename over a read-only file.
    #   - internal/memtable runs its RING and BUFFER tests only. Those are
    #     the mmap-backed types this port rewrote, so they are the point;
    #     the rest of the package includes pack-cache eviction, which
    #     unlinks files a reader still holds open.
    #   - No mount gates, no Docker gates, no fuzzing. None of them have a
    #     Windows form.
    #
    # Budget: build + vet dominate, and a Windows runner is the slowest in
    # the matrix. The -timeout is well under the job cap for the reason the
    # unit lane's is -- Go's own deadline prints a goroutine dump naming
    # the test, a killed runner prints nothing.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      # ./... and not ./cmd/pelfs: the point is that no package in the tree
      # has drifted, including the ones whose tests are skipped below.
      - name: Build the whole tree
        run: go build ./...
        env:
          CGO_ENABLED: "0"
      - name: Vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      # Named packages, not ./... with exclusions: an explicit list fails
      # when a package is ADDED and nobody decided which side of the line
      # it is on, which is the failure worth having.
      - name: Unit tests (platform-independent packages)
        run: >
          go test -count=1 -timeout 10m
          ./internal/mmapfile/
          ./internal/extsort/
          ./internal/catalog/
          ./internal/superblock/
          ./internal/entrycodec/
          ./internal/chunkid/
          ./internal/packstore/
          ./internal/packidx/
          ./internal/manifest/
          ./internal/refs/
          ./internal/stats/
          ./internal/scratch/
          ./internal/retention/
          ./internal/mpi/
          ./internal/lease/
          ./internal/version/
          ./internal/ui/
        env:
          CGO_ENABLED: "0"
      # The mmap port, specifically. internal/mmapfile is the new code and
      # internal/extsort above is one of its four callers; these are the
      # other two, and they are the ones that write THROUGH a mapping and
      # then delete the file it was made from -- the operation Windows
      # refuses while a mapping is live.
      - name: The mmap-backed memtable types
        run: go test -count=1 -timeout 5m -run "^Test(Ring|Buffer|DefaultRing)" ./internal/memtable/
        env:
          CGO_ENABLED: "0"

  race:
    # The whole suite under the race detector. Only the op-sequence stress
    # was raced before, which left every OTHER concurrent thing in the
    # tree — the memtable's promotion against its writers, genfs's caches,
    # the overlay's checkpoint against reads, the NFS and FUSE frontends
    # serving in parallel — checked by nothing.
    #
    # Measured 187s for ./... on a 12-core M-series box (694s of CPU), so
    # a narrower lane was never needed: the guidance was to split it only
    # if the full run passed 15 minutes, and it does not. A runner has
    # fewer and slower cores, so budget generously and let the timeout be
    # the thing that complains.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      # 20m against a 30m job cap: the race detector makes everything
      # several times slower, so the per-package deadline is looser than
      # the unit lane's — but it still fires first, and still hands back a
      # goroutine dump rather than a killed runner.
      - name: Race detector over the whole tree
        run: go test -race -count=1 -timeout 20m ./...

  e2e:
    # The whole user-facing workflow -- create, write, seal, read back,
    # encrypt, prefetch, lease, gc, fsck -- in a container, because the
    # gate mounts a real filesystem. Measured 10s.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Full workflow loop in a container against fakeorigin
        run: ./scripts/e2e-docker.sh

  integration:
    # Builds a pelican server from the revision go.mod pins and runs
    # transport/publish against a federation-in-a-box. Much the longest
    # job, and almost all of it is building someone else's tree.
    #
    # No Node, and no `make web-build`. This job used to build pelican's
    # Next.js bundle before the binary, and the day upstream pelican
    # switched that build from npm to pnpm the job died on a runner with
    # no pnpm -- `/bin/sh: 1: pnpm: not found`, from inside someone
    # else's Makefile, looking for all the world like a test failure. It
    # turns out the bundle was never needed: pelican commits an empty
    # web_ui/frontend/out/placeholder to satisfy its own //go:embed, and
    # the federation this gate stands up runs with the UI switched off.
    # scripts/build-pelican-server.sh states that reasoning in full and
    # CHECKS every part of it before it builds, so if pelican changes
    # underneath us the job says which assumption broke.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      # Deliberately runnable by hand, identically: the same script builds
      # the same binary on a developer machine, so this step is one a
      # human can reproduce rather than a sequence only CI ever runs.
      - name: Build the pelican server the gate tests against
        run: ./scripts/build-pelican-server.sh "$GITHUB_WORKSPACE/pelican-bin" "$GITHUB_WORKSPACE/pelican-src"
      - name: Integration tests against federation-in-a-box
        run: PELICAN_BIN="$GITHUB_WORKSPACE/pelican-bin" ./scripts/integration-pelican.sh

  fuzz:
    # Seven targets at 30s each, plus the corpus replay. ~4 minutes.
    #
    # Tier 1 (parsers): unrestricted — pure functions over untrusted
    # federation bytes, safe to run anywhere. Short smoke runs on top of
    # the checked-in corpus under each package's testdata/fuzz/, which
    # every ordinary `go test` replays as well — that is what carries a
    # finding forward once it has been found.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      # The corpus is the point of the job: fail loudly if it went missing
      # rather than fuzzing from nothing and calling it a pass.
      - name: Check the committed corpus is there
        run: |
          set -e
          for d in internal/packstore/testdata/fuzz/FuzzDecodeTrailer \
                   internal/packstore/testdata/fuzz/FuzzParseTail \
                   internal/superblock/testdata/fuzz/FuzzDecodeVerify \
                   internal/entrycodec/testdata/fuzz/FuzzDecode \
                   internal/chunkid/testdata/fuzz/FuzzChunker \
                   internal/catalog/testdata/fuzz/FuzzStaticCatalog \
                   internal/packidx/testdata/fuzz/FuzzOpenTable; do
            n=$(find "$d" -type f 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "no corpus in $d" >&2; exit 1; }
            echo "$d: $n inputs"
          done
      - name: Fuzz parsers (30s each)
        run: |
          set -e
          for t in \
            "internal/packstore FuzzDecodeTrailer" \
            "internal/packstore FuzzParseTail" \
            "internal/superblock FuzzDecodeVerify" \
            "internal/entrycodec FuzzDecode" \
            "internal/chunkid FuzzChunker" \
            "internal/catalog FuzzStaticCatalog" \
            "internal/packidx FuzzOpenTable"; do
            set -- $t
            echo "== $2 =="
            CGO_ENABLED=0 go test -run xxx -fuzz "^$2\$" -fuzztime 30s "./$1/"
          done
      # A failing input is written into the package's own testdata/fuzz
      # directory, which is exactly the file that has to be committed to
      # carry the finding forward. Upload it, or the one artifact that
      # made this job worth running dies with the runner.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: internal/*/testdata/fuzz/**
          if-no-files-found: warn

  opfuzz:
    # Tier 2 (filesystem operation sequences): CONTAINED, always. The
    # launcher cross-compiles on the host and runs the binary in a
    # sealed, network-less, read-only container — never on the runner
    # filesystem directly. Measured 122s + 34s.
    #
    # The budget is an EXEC COUNT, not a duration, and 120000x is not a
    # cut: this runner does 103k-118k execs in the 120s this used to ask
    # for (860-990/sec across the last four runs), so the count is the
    # same work with the machine-dependence taken out — and it sidesteps
    # golang/go#72104, where the engine reports its own fuzztime
    # expiry as the failure "context deadline exceeded". KL-23 has the
    # trace. Wall clock lands in the same 2-2.5m; a runner would have to
    # be 6x slower than this one to reach the launcher's -test.timeout.
    #
    # timeout-minutes stays 20: it is the outermost guard now, behind the
    # 15m -test.timeout that turns a hung fuzz target into goroutine
    # stacks instead of a job kill.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Op-sequence fuzzing (contained)
        run: ./scripts/opfuzz-docker.sh 120000x FuzzOps
      - name: Concurrent op stress under -race (contained)
        run: ./scripts/opfuzz-docker.sh 0 ConcurrentOpsStress

  hostile:
    # THE IMPOLITE USER, continuously. Every correctness bug in the v0.1.0
    # release week — sparse extents from out-of-order NFS write trains,
    # rechunk CLen/Alg metadata, the condemned-ledger drop, symlink-
    # following REMOVE, dangling-link rm -rf — was found by the owner's
    # ordinary shell usage and NONE by a gate, because every other gate
    # writes polite tar-shaped data: files created once, written front to
    # back, closed, never revisited. This gate writes the shapes a real
    # tree has and a tarball does not.
    #
    # Adversarial op sequences against a REAL mount on BOTH frontends,
    # with a reference tree on tmpfs mutated identically and compared
    # byte-and-metadata-exact at 1s checkpoints; then the whole lifecycle
    # (seal, cold remount, full compare, fsck --deep, gc) and a kill -9
    # with remount and recovery. Contained the way opfuzz is, and then
    # some: build tag, env gate, an image sentinel, os.Root confinement
    # proven before the first op, and a container whose only host-visible
    # path is a read-only directory of two binaries.
    #
    # Budget: a FIXED seed, so a red run is replayable by hand with the
    # same command, and a small op count. Measured 53s for the plaintext
    # leg plus 25s for the encrypted corpus, end to end on Docker for Mac
    # (was 29s before the fill vocabulary). The timeout is 15m because a
    # STALL is the failure mode worth catching here (a wedged mount or a
    # seal that never returns), and the harness's own deadlines fire first
    # and print the phase they were stuck in.
    #
    # WHAT THE RAISE BOUGHT, since it is most of the budget: two corpus
    # entries at ~3s x 2 frontends each (12s), a second WRITABLE session
    # over the generation the first one published (phase C2, ~5s on FUSE),
    # and one fsck --deep of the generation a mid-run CHECKPOINT published
    # rather than only the one the seal did. Between them they retro-catch
    # the release-week rechunk CLen/Alg bug -- which nothing here could
    # reach before, because every body was incompressible -- and they
    # found an open bug at HEAD. Cheapest levers if it needs trimming, in
    # order: --large-file 0 (drops the one multi-megabyte body), then move
    # the encrypted leg to a nightly, then phase C2 to `make hostile-long`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      # The corpus is checked by name for the same reason the fuzz job
      # checks its own: a corpus that quietly went missing would leave
      # this job running random sequences only, and the sequences that
      # already found bugs are the ones that must never stop running.
      - name: Check the committed corpus is there
        run: |
          set -e
          n=$(find internal/hostile/testdata/corpus -name '*.plan' | wc -l)
          [ "$n" -gt 0 ] || { echo "no plans in internal/hostile/testdata/corpus" >&2; exit 1; }
          echo "$n corpus entries:"
          for f in internal/hostile/testdata/corpus/*.plan; do
            echo "  $(basename "$f"): $(grep -cvE '^\s*(#|$)' "$f") ops"
          done
      - name: Hostile exerciser (contained; corpus + fixed-seed run, both frontends)
        run: ./scripts/hostile-docker.sh
      # THE ENCRYPTED LEG, corpus only. Encryption is not a second copy of
      # the same test: a chunk is compressed and THEN sealed, so a nonce
      # and a GCM tag are always added and no entry in any pack is the
      # length of its plaintext -- for EVERY chunk, not only the
      # compressible ones. Measured against the pre-fix build of the
      # rechunk CLen/Alg bug (--retro c26428f --encrypt), that is the
      # difference between catching it on the compressible file only and
      # catching it on the incompressible control too, off by exactly the
      # 28 bytes the seal adds.
      #
      # The CORPUS rather than the whole campaign, deliberately: 25s
      # against 65s, and the corpus is where the entry that pins this
      # interaction lives. `scripts/hostile-docker.sh --encrypt` runs the
      # full encrypted campaign and is the manual/nightly form.
      - name: Hostile exerciser, ENCRYPTED volumes (contained; corpus, both frontends)
        run: ./scripts/hostile-docker.sh --encrypt --run TestReplayTheRegressionCorpus

  mount-gate:
    # A REAL kernel mount of a published generation through
    # genfs+rawfuse, exercised by the end-to-end mount script. Linux only
    # — this is the coverage a macFUSE-less dev machine cannot provide.
    # Measured 24s, with the NFS leg now mandatory rather than skippable.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      # Through the container launcher, not the script bare: the gate's NFS
      # leg needs a kernel NFS client, and the runner image has no
      # nfs-common. mount-gate-docker.sh builds an image that does, which
      # is why the leg now hard-fails when mount.nfs is missing instead of
      # printing a note and passing.
      - name: Mount a published generation and benchmark it
        run: ./scripts/mount-gate-docker.sh

  browse-gate:
    # THE WHOLE OF `pelfs browse`, END TO END, WITH NOTHING MOCKED: the
    # shipped binary against a fakeorigin, driven by curl as the browser and
    # by REAL Cyberduck (`duck`, its own CLI and its own protocol stack) as
    # the WebDAV client, and then verified by a SECOND, FRESH pelfs that
    # mounts the published generation from an empty state directory.
    #
    # That last step is why this is a durability gate and not an HTTP one.
    # Every check before it can pass with a broken seal; `pelfs shell --ro`
    # reading the bytes back out of the federation is the one that cannot.
    #
    # It is its own job rather than a leg of e2e because it needs an image
    # e2e does not have (Cyberduck's apt repository) and because a failure
    # here means something different: e2e red is the filesystem, this red is
    # the browser surface. Measured 33 checks in ~90s, most of it the JVM.
    #
    # The image build needs network; the RUN is --network none, and the only
    # thing it talks to is a fakeorigin on its own loopback.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: pelfs browse end to end, with real Cyberduck and a real mount
        run: ./scripts/browse-gate-docker.sh

  crash:
    # kill -9 a read-write mount while it is mid-flush, remount the same
    # state dir, and hold recovery to its contract. The repo had no test
    # that PRODUCED a crash — the memtable's recovery tests construct
    # post-crash state rather than produce it — and the write path is
    # default-on. Measured 14s.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: SIGKILL a mount mid-flush and recover it
        env:
          PELFS_CRASH_OUT: ${{ github.workspace }}/crash-out
        run: ./scripts/crash-recovery-docker.sh
      - name: Upload the crash logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: crash-out/
          if-no-files-found: warn

  big-tree:
    # The scale gate: 50,000 files (62,500 with the hard links) untarred
    # through BOTH frontends, diffed live, sealed, cold-remounted into a
    # state dir that has never existed, fsck'd, gc'd, and then done again
    # as a second generation carrying adds, a modify and a delete.
    #
    # Until this existed, the largest tree CI put through a real mount was
    # a handful of files, and the only big-tree numbers anyone had came
    # from running a benchmark by hand and reading it.
    #
    # Measured 3.9 minutes end to end (Docker on an M-series Mac). The
    # in-script cap is set below the job cap on purpose: it fails with a
    # sentence about which phase stalled, where the job cap just kills the
    # runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Enable FUSE
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
      - name: 50k files, both frontends, two generations
        env:
          PELFS_GATE_TIMEOUT: "1200"
          # Measured 1.46x at this size; the extra room is for a noisy
          # shared runner, not for a slower write path.
          PELFS_MAX_DECAY: "2.5"
          PELFS_BENCH_OUT: ${{ github.workspace }}/bigtree-out
        run: ./scripts/bench-untar-nfs-docker.sh 50000 2500 4
      - name: Upload the gate's logs and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: big-tree-logs
          path: bigtree-out/
          if-no-files-found: warn

  bench:
    # Benchmarks are not a pass/fail gate; they run to catch build rot in
    # the harness and to leave numbers in the log for comparison.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Microbenchmarks
        run: CGO_ENABLED=0 go test -run xxx -bench . -benchtime 0.3s ./internal/genfs/

  # ---------------------------------------------------------------- release
  # Tag-only. Everything above runs on the tag as well (that is what the
  # `tags:` trigger is for), and these two jobs wait for the gates, so a
  # release cannot be cut from a commit whose tests failed -- which was
  # possible right up until now, CI having never run on a tag at all.

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, windows, race, e2e, integration, fuzz, opfuzz, hostile, mount-gate, browse-gate, crash, big-tree]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      # CGO_ENABLED=0 is the project's whole build story (pure-Go SQLite,
      # pure-Go crypto), so a release binary is a single static file per
      # platform and cross-compiling all four on one runner is honest.
      #
      # The -X path is internal/version.release, the fallback documented in
      # version.go for builds with no VCS to read. It is a FALLBACK: a
      # normal `go build` still reports the revision from runtime/debug,
      # and the package deliberately refuses to call a pseudo-version a
      # release. The verification step below is why this is not taken on
      # trust -- a silently-wrong -X path produces a binary that reports
      # "unknown" and nobody notices until a bug report arrives without a
      # version in it.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          dist="pelfs_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "$dist"
          # Windows will not execute a file without the extension, and the
          # release is a tarball on every platform because the runner this
          # builds on is Linux -- cross-compiling is the whole story here,
          # so there is no zip step to add and no second runner to add it on.
          exe=""
          [ "$GOOS" = windows ] && exe=".exe"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X github.com/bbockelm/pelfs/internal/version.release=${GITHUB_REF_NAME}" \
            -o "$dist/pelfs$exe" ./cmd/pelfs
          # NOTICE is not optional: Apache-2.0 section 4(d) requires it
          # travel with the distribution, and it is also where the Pelican
          # Platform mark's permission and the "not an official Pelican
          # product" disclaimer are recorded.
          cp README.md CHANGELOG.md LICENSE NOTICE "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"
          ls -l "${dist}.tar.gz"
      # The runner is linux/amd64, so one of the four can actually be run.
      # If the -X path ever drifts from the variable in version.go, this is
      # the step that says so, at the moment it matters.
      - name: Verify the version stamp took
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          got=$("./pelfs_${GITHUB_REF_NAME}_linux_amd64/pelfs" version | head -1)
          echo "$got"
          case "$got" in
            "pelfs ${GITHUB_REF_NAME}"*) echo "version stamp is correct" ;;
            *) echo "the release build reports '$got', not ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: pelfs_${{ matrix.goos }}_${{ matrix.goarch }}
          path: pelfs_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scoped HERE and nowhere else: the workflow default is read-only, so
    # the write, signing and attestation rights exist only in the one job
    # that publishes, and only on a tag.
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # OIDC token the attestation is signed against
      attestations: write  # record the provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      # Provenance over the tarballs themselves, so a downloader can ask
      # GitHub which workflow, at which commit, produced this exact byte
      # stream -- `gh attestation verify pelfs_*.tar.gz --repo <repo>`.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      # The release notes are the CHANGELOG's section for this tag, not a
      # generated commit list. If there is no section, that is a release
      # nobody wrote notes for, and it stops here rather than shipping an
      # empty body.
      - name: Release notes from the CHANGELOG
        run: |
          set -euo pipefail
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "([^0-9a-zA-Z.-]|$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section to release from" >&2
            exit 1
          fi
          echo "--- notes ---"; head -20 notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
