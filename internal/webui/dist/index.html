     there is nothing at all on the screen. -->
<!-- The class rather than a style attribute, and that is the
     Content-Security-Policy talking: the server serves this page under
     `style-src 'self'` with no 'unsafe-inline' (cmd/pelfs/browse.go, appCSP),
     which refuses an inline style attribute. The linked stylesheet still
     loads with scripting off, so the rule lands. -->
<noscript>
  <div data-testid="noscript" class="pelfs-noscript">
    This page needs JavaScript to list files and to show what is published.
    Nothing is wrong with your data: <code>pelfs browse</code> is still running in
    your terminal, and Ctrl-C there stops it (sealing, if you started it with
    <code>--rw</code>). To move files without a browser, use <code>pelfs mount</code>.
  </div>
</noscript>
