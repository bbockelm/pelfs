<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- No remote origins, ever: this page is served from a Go binary on
     loopback and must work with no network at all. -->
<title>pelfs</title>
<link rel="icon" href="./brand/favicon.svg" />
<div id="root"></div>
<!-- Cheap, and it is the difference between a blank page and a person who
     knows their data is fine. The same message cmd/pelfs/browse.html carries,
     for the same reason: a file manager is a React app, so with scripting off
     there is nothing at all on the screen. -->
<noscript>
  <div data-testid="noscript" style="margin: 2rem auto; max-width: 40rem; font-family: system-ui, sans-serif">
    This page needs JavaScript to list files and to show what is published.
    Nothing is wrong with your data: <code>pelfs browse</code> is still running in
    your terminal, and Ctrl-C there stops it (sealing, if you started it with
    <code>--rw</code>). To move files without a browser, use <code>pelfs mount</code>.
  </div>
</noscript>
<script type="module" src="/src/main.tsx"></script>
